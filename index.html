.sky,.top,.bottom,.orb{position:absolute;pointer-events:none}
.sky{inset:0;width:100%;height:100%}
.top{top:0;right:0;width:76%}
.bottom{left:0;bottom:0;width:100%;height:290px}
.orb{left:-34px;top:300px;width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#b9fff0,#00b894 55%,#04594b);box-shadow:0 0 30px rgba(0,212,170,.45);transition:opacity .3s}
.orb::after{content:"";position:absolute;left:-26px;right:-26px;top:38px;height:20px;border:1.5px solid rgba(185,255,240,.55);border-radius:50%;transform:rotate(-14deg)}
.phone:not([data-view="start"]) .orb{opacity:0}
.content{position:relative;z-index:1;display:flex;flex-direction:column;flex:1}
.bar{display:flex;align-items:center;gap:10px;min-height:34px}
.logo{font-weight:800;font-size:1.15rem;letter-spacing:-.01em;background:linear-gradient(135deg,#c2bdff,#00D4AA);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

h1{font-size:2.6rem;line-height:1.04;margin:34px 0 8px;letter-spacing:-.03em;max-width:240px}
.sub{margin:0;color:var(--sub);font-size:.95rem}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}

.startview,.formview{display:flex;flex-direction:column;flex:1}
.phone[data-view="start"] .formview,.phone:not([data-view="start"]) .startview{display:none}
.actions{margin-top:auto;padding-bottom:70px}
.pill{width:100%;border:0;border-radius:999px;background:var(--deep);color:#fff;font:inherit;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:16px;cursor:pointer;margin-top:12px}
.pill:hover{background:#12032a}
.pill:disabled{opacity:.65;cursor:not-allowed}
form{margin-top:auto;padding-top:22px}
.field{display:flex;align-items:center;gap:10px;background:#fff;border-radius:999px;padding:0 16px;margin-bottom:11px;color:#6f6480}
.field svg{width:18px;height:18px;flex:none}
.field input{flex:1;min-width:0;border:0;outline:0;background:none;padding:13px 0;font:inherit;font-size:.93rem;color:#241238}
.field input::placeholder{color:#9a90a8}
.field:focus-within{box-shadow:0 0 0 3px var(--teal)}
.eye{border:0;background:none;cursor:pointer;font-size:15px;padding:4px;color:#6f6480}
.row{display:flex;justify-content:space-between;align-items:center;font-size:.82rem;margin:2px 4px 10px;gap:8px}
.row label{display:flex;gap:8px;align-items:center;cursor:pointer;color:var(--sub)}
.row input{accent-color:var(--teal);width:16px;height:16px}
.link{background:none;border:0;padding:0;font:inherit;color:#fff;cursor:pointer;text-decoration:underline}
.msg{min-height:1.2em;font-size:.86rem;font-weight:600;margin:0 4px 6px}
.msg.error{color:var(--err)}.msg.success{color:var(--ok)}
.switch{position:relative;z-index:1;text-align:center;font-size:.85rem;color:var(--deep);padding:16px 0 24px;margin:0}

.tw{animation:tw 3.4s ease-in-out infinite alternate}

:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.pill:focus-visible{outline-color:var(--peach3)}
</style>

<script type="module">
import { supabase } from './supabase.js'

if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {})

supabase.auth.getSession().then(({ data: { session } }) => {
  if (session) window.location.href = 'feed.html'
})

const $ = id => document.getElementById(id)
const show = (id, on) => $(id).classList.toggle('hide', !on)
let signup = false

function say(text, type) { $('msg').className = 'msg ' + (type || ''); $('msg').textContent = text }

function view(name) {
  $('phone').dataset.view = name
  if (name === 'start') return
  signup = name === 'signup'
  $('title').textContent = signup ? 'Sign Up' : 'Welcome Back'
  $('sub').textContent = signup ? "Hello! Let's join with us" : 'Hey! Good to see you again'
  $('go').textContent = signup ? 'Sign up' : 'Sign in'
  $('switchText').textContent = signup ? 'Already have an account?' : "Don't have an account?"
  $('switchBtn').textContent = signup ? 'Sign in' : 'Sign up'
  $('password').autocomplete = signup ? 'new-password' : 'current-password'
  show('nameWrap', signup); show('confirmWrap', signup); show('agreeRow', signup); show('loginRow', !signup)
  say('')
}
$('toSignup').onclick = () => view('signup')
$('toLogin').onclick = () => view('login')
$('back').onclick = () => view('start')
$('switchBtn').onclick = () => view(signup ? 'login' : 'signup')

$('eye').onclick = () => {
  const pw = $('password'), hidden = pw.type === 'password'
  pw.type = hidden ? 'text' : 'password'
  $('confirm').type = pw.type
  $('eye').textContent = hidden ? '🙈' : '👁'
}

$('form').onsubmit = async e => {
  e.preventDefault()
  const email = $('email').value.trim(), password = $('password').value, name = $('name').value.trim()

  if (!email || !password) return say('Please fill in all fields.', 'error')
  if (signup) {
    if (!name) return say('Please enter your name.', 'error')
    if (password !== $('confirm').value) return say('Passwords do not match.', 'error')
    if (!$('agree').checked) return say('Please accept the privacy policy.', 'error')
  }

  const btn = $('go'), label = btn.textContent
  btn.textContent = signup ? 'Creating account...' : 'Signing in...'
  btn.disabled = true
  say('')

  const { data, error } = signup
    ? await supabase.auth.signUp({ email, password, options: { data: { full_name: name } } })
    : await supabase.auth.signInWithPassword({ email, password })

  if (error) {
    say(error.message, 'error')
    btn.textContent = label
    btn.disabled = false
  } else if (signup && !data.session) {
    say('📧 Check your email to confirm your account.', 'success')
    btn.textContent = label
    btn.disabled = false
  } else {
    say('✅ Done! Redirecting...', 'success')
    setTimeout(() => window.location.href = 'feed.html', 800)
  }
}

$('forgot').onclick = async () => {
  const email = $('email').value.trim()
  if (!email) return say('Enter your email above first.', 'error')
  const { error } = await supabase.auth.resetPasswordForEmail(email, {
    redirectTo: 'https://connectx-psi.vercel.app/reset-password.html'
  })
  error ? say(error.message, 'error') : say('📧 Password reset email sent! Check your inbox.', 'success')
}
</script>
